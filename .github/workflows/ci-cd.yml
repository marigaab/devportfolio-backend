name: Pipeline Backend CI/CD

on:
  push:
    branches: [ "main", "Pipeline" ]
  pull_request:
    branches: [ "main" ]

# LIBERA PERMISSÃO DE ESCRITA PARA O GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devportfolio-backend:latest

jobs:
  # ==========================================
  # ETAPA 1: CI (Continuous Integration)
  # ==========================================
  ci-backend:
    name: 🧪 CI - Build & Qualidade Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar com Maven
        working-directory: portifolio-api
        run: mvn clean package -DskipTests

      - name: Análise Estática / Lint Simulado
        run: echo "Análise de Qualidade concluída com sucesso!"

  # ==========================================
  # ETAPA 2: CD (Continuous Deployment)
  # ==========================================
  cd-backend:
    name: 🚀 CD - Push da Imagem & Deploy na OCI
    needs: ci-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Pipeline'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Deploy Remoto na Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.15.78.144
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/opc/app
            docker compose pull devportfolio-backend
            docker compose up -d --no-deps devportfolio-backend
            docker image prune -f