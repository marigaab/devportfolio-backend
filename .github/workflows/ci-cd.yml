name: Pipeline Backend CI/CD

on:
  push:
    branches: [ "main", "Pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: true

      - name: Executar Testes Unitários e Build Automatizado
        working-directory: ./portfolio-api
        run: mvn clean package

      - name: Análise Estática / Lint Simulado
        run: echo "Análise de Qualidade concluída com sucesso!"