name: Pipeline Backend CI/CD

on:
  push:
    branches: [ "main", "Pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Entrar na pasta e Compilar com Maven
        working-directory: portifolio-api
        run: mvn clean package -DskipTests

      - name: Análise Estática / Lint Simulado
        run: echo "Análise de Qualidade concluída com sucesso!"